# Catalogo interfaccia (italiano). Conservare le chiavi; tradurre solo i valori.

ui:
  autostart_label: Mostra questa finestra all’avvio
  sidebar_label: Capitoli
  actions_label: Azioni

dialogs:
  startup_failed: Benvenuto non può avviarsi
  action_unavailable: Questa azione non è disponibile
  unknown_action: Il manuale fa riferimento a un’azione sconosciuta.
  action_prepare_failed: Qualcosa è andato storto preparando questa azione.
  open_action_failed: Impossibile aprire questa azione
  open_url_failed: Impossibile aprire la pagina web
  disallowed_url: È possibile aprire solo collegamenti http e https.
  autostart_failed: Impossibile modificare l’avvio automatico

facts:
  distribution: Distribuzione
  edition: Edizione
  debian_version: Versione Debian
  desktop: Desktop
  session_type: Tipo di sessione
  architecture: Architettura
  kernel: Kernel
  hostname: Nome host
  processor: Processore
  memory: Memoria
  disk_usage: Uso del disco

capabilities:
  desktop-settings:
    unavailable: >
      Le impostazioni del desktop non sono disponibili.
      Aprirle dal menu delle applicazioni.
  network-settings:
    unavailable: >
      Le impostazioni di rete non sono disponibili.
      Configurare la rete con gli strumenti di rete del desktop,
      oppure rivolgersi all'amministratore.
  software-install:
    unavailable: >
      Nessun programma di installazione software è disponibile.
      Installare le applicazioni con gli strumenti dei pacchetti del sistema,
      oppure rivolgersi all'amministratore.
  system-update:
    unavailable: |
      Nessun terminale è disponibile, quindi il comando di
      aggiornamento non può essere avviato da qui.

      Aprire un terminale dal menu delle applicazioni ed eseguire:
        sudo apt update && sudo apt upgrade
